name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is a generated build artifact, not source, so it is
      # gitignored and regenerated here before anything that depends on its types.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  schema:
    name: Prisma schema validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate schema
        run: npx prisma validate
      - name: Fail if the schema was edited without a migration
        run: |
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD \
             | grep -q '^prisma/schema.prisma$'; then
            if ! git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD \
                 | grep -q '^prisma/migrations/'; then
              echo "::error::schema.prisma changed but no migration was added."
              echo "Run: npx prisma migrate dev --name <describe-the-change>"
              exit 1
            fi
          fi
        if: github.event_name == 'pull_request'
