name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    # The build statically generates the public pages, and those pages read the
    # database to decide what the site may claim — whether the farm is being
    # built, waiting for first lay, or selling. So `npm run build` genuinely
    # needs Postgres, and has failed here on every run since those pages
    # existed. A migrated but EMPTY database is enough: with no flocks the site
    # correctly renders its "being built" state, which is also worth proving.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adrah
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adrah
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adrah

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is a generated build artifact, not source, so it is
      # gitignored and regenerated here before anything that depends on its types.
      - name: Generate Prisma client
        run: npx prisma generate

      # `deploy`, not `dev`: it applies the committed migrations and nothing
      # else. If a migration is missing or broken, this is where CI says so
      # rather than the build failing later for a reason that looks unrelated.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  schema:
    name: Prisma schema validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The guard below diffs against origin/main, which does not exist in the
        # shallow clone checkout makes by default — the step would fail on the
        # first pull request with "unknown revision" rather than on a real
        # problem. Full history costs seconds on a repository this size.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate schema
        run: npx prisma validate
      - name: Fail if the schema was edited without a migration
        run: |
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD \
             | grep -q '^prisma/schema.prisma$'; then
            if ! git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD \
                 | grep -q '^prisma/migrations/'; then
              echo "::error::schema.prisma changed but no migration was added."
              echo "Run: npx prisma migrate dev --name <describe-the-change>"
              exit 1
            fi
          fi
        if: github.event_name == 'pull_request'